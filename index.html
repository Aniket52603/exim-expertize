<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- ================= GOOGLE SEARCH CONSOLE ================= -->
    <meta
      name="google-site-verification"
      content="zVtpCVqaCopIBSaccPFa3eZ88Y76yqTsNbqwmb0Ocxo"
    />

    <!-- ================= LCP HERO IMAGE (first, so it gets bandwidth priority) ================= -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/image.webp"
      fetchpriority="high"
    />

    <!--
      OPTIONAL: once you have created public/image-800.webp (an 800px-wide copy),
      replace the preload above with this one, and add the SAME srcSet/sizes
      to the <img> in Home.jsx. They must match, or the image downloads twice.

      <link
        rel="preload"
        as="image"
        type="image/webp"
        href="/image.webp"
        imagesrcset="/image-800.webp 800w, /image.webp 1600w"
        imagesizes="100vw"
        fetchpriority="high"
      />
    -->

    <!-- ================= FONT PRELOAD (above-the-fold only) ================= -->
    <!-- crossorigin is required for font preloads, even for same-origin files -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Inter-Variable-latin.woff2"
      crossorigin
    />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Playfair_Display/static/PlayfairDisplay-SemiBold.woff2"
      crossorigin
    />

    <!-- ================= PRIMARY SEO ================= -->
    <title>Exim Expertize | Foreign Trade & Customs Consultants</title>

    <meta
      name="description"
      content="Exim Expertize provides expert consultancy in Foreign Trade Policy, Customs, GST, FEMA, MOOWR, AEO, EOU, SEZ, EPCG, Duty Drawback and ICEGATE services."

    <meta

      content="Exim Expertize, EXIM consultancy, export import consultant, foreign trade consultant, customs consultant, DGFT consultant, ICEGATE consultant, EPCG, EOU, SEZ, AEO, duty drawback"
    />

    />

    <!-- ================= FAVICON ================= -->

    />
